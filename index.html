<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RAYSYNIX — Ideas to Useful Things</title>
  <meta name="description" content="RAYSYNIX — Creator Product Studio. Ideas to useful things.">
  <style>
    :root{--bg:#080a17;--blue:#0845ff;--white:#fff;--muted:#aeb4c7}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--bg)}
    body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--white);overflow-x:hidden}
    .screen{position:relative;width:100%;max-width:1440px;margin:0 auto;line-height:0}
    .screen img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
    .hotspot{position:absolute;display:block;z-index:5;border-radius:14px;cursor:pointer;outline:none}
    .hotspot:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--blue)}
    .telegram{left:81.4%;top:10.8%;width:13.9%;height:5.9%}
    .hero-chat{left:4.1%;top:71.0%;width:18.5%;height:7.0%}
    .hero-how{left:24.3%;top:71.0%;width:17%;height:7.0%}
    .apply{left:35.5%;top:63.3%;width:29%;height:6.5%}
    .screen6-apply{left:35.5%;top:63.3%;width:29%;height:6.5%}
    .faq-hit{position:absolute;left:4.1%;width:91.8%;height:5.1%;z-index:6;cursor:pointer;border-radius:8px}
    .faq1{top:75.7%}.faq2{top:81.0%}.faq3{top:86.2%}.faq4{top:91.4%}.faq5{top:96.4%;height:3.4%}
    dialog{border:0;padding:0;background:transparent;color:inherit;width:min(680px,calc(100vw - 32px));max-width:680px}
    dialog::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(5px)}
    .modal{background:#080a17;border:1px solid #153fd1;border-radius:20px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.5);line-height:1.45}
    .modal .tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:#1f5cff;text-transform:uppercase;margin-bottom:12px}
    .modal h2{font-size:24px;line-height:1.15;margin:0 38px 12px 0}
    .modal p{font-size:15px;line-height:1.55;color:#d8dcea;margin:0 0 22px}
    .modal-actions{display:flex;gap:10px;align-items:center}
    .modal a,.modal button{appearance:none;border:0;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
    .modal a{background:#0845ff;color:#fff}.modal button{background:#151a2c;color:#d8dcea}
    .close-x{position:absolute;right:28px;top:22px;background:transparent!important;padding:4px!important;font-size:24px!important;color:#aeb4c7!important}
    @media(max-width:600px){
      .screen{max-width:390px}
      .telegram{left:74.5%;top:9.2%;width:21%;height:4.8%}
      .hero-chat{left:5.8%;top:71.5%;width:31.5%;height:6.5%}
      .hero-how{left:38.5%;top:71.5%;width:31%;height:6.5%}
      .apply{left:23%;top:64.0%;width:54%;height:5.0%}
      .screen6-apply{left:23%;top:64.0%;width:54%;height:5.0%}
      .faq-hit{left:5%;width:90%;height:5.0%}
      .faq1{top:75.0%}.faq2{top:80.1%}.faq3{top:85.1%}.faq4{top:90.1%}.faq5{top:95.0%;height:4%}
      .modal{padding:22px}.modal h2{font-size:21px}.modal p{font-size:14px}
      .modal-actions{flex-direction:column;align-items:stretch}.modal a,.modal button{text-align:center}
    }
    @media(prefers-reduced-motion:no-preference){dialog{animation:fade .18s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main aria-label="RAYSYNIX landing page">
    <section class="screen" id="hero">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/1.png"><img src="assets/desktop/1.png" alt="RAYSYNIX Creator Product Studio — hero"></picture>
      <a class="hotspot telegram" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start for free on Telegram"></a>
      <a class="hotspot hero-chat" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start a conversation on Telegram"></a>
      <a class="hotspot hero-how" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="See how it works on Telegram"></a>
    </section>

    <section class="screen" id="opportunity">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/2.png"><img src="assets/desktop/2.png" alt="The opportunity"></picture>
      <a class="hotspot telegram" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start for free on Telegram"></a>
    </section>

    <section class="screen" id="mechanism">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/3.png"><img src="assets/desktop/3.png" alt="The mechanism"></picture>
      <a class="hotspot telegram" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start for free on Telegram"></a>
    </section>

    <section class="screen" id="products">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/4.png"><img src="assets/desktop/4.png" alt="What we build"></picture>
      <a class="hotspot telegram" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start for free on Telegram"></a>
    </section>

    <section class="screen" id="framework">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/5.png"><img src="assets/desktop/5.png" alt="Product framework"></picture>
      <a class="hotspot telegram" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Start for free on Telegram"></a>
    </section>

    <section class="screen" id="faq">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/6.png"><img src="assets/desktop/6.png" alt="Product system and frequently asked questions"></picture>
      <a class="hotspot telegram screen6-apply" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Apply for a product opportunity audit on Telegram"></a>
      <button class="faq-hit faq1" type="button" data-faq="0" aria-label="Open FAQ: What exactly do you do?"></button>
      <button class="faq-hit faq2" type="button" data-faq="1" aria-label="Open FAQ: Do I need an existing digital product?"></button>
      <button class="faq-hit faq3" type="button" data-faq="2" aria-label="Open FAQ: How large does my audience need to be?"></button>
      <button class="faq-hit faq4" type="button" data-faq="3" aria-label="Open FAQ: Who owns the product?"></button>
      <button class="faq-hit faq5" type="button" data-faq="4" aria-label="Open FAQ: How does the partnership and revenue model work?"></button>
    </section>

    <section class="screen" id="cta">
      <picture><source media="(max-width:600px)" srcset="assets/mobile/7.png"><img src="assets/desktop/7.png" alt="Final call to action"></picture>
      <a class="hotspot telegram apply" href="https://t.me/Raysynix" target="_blank" rel="noopener" aria-label="Apply for a product opportunity audit on Telegram"></a>
    </section>
  </main>

  <dialog id="faqDialog">
    <div class="modal">
      <button class="close-x" id="closeFaq" type="button" aria-label="Close FAQ">×</button>
      <div class="tag">RAYSYNIX FAQ</div>
      <h2 id="faqTitle"></h2>
      <p id="faqAnswer"></p>
      <div class="modal-actions">
        <a href="https://t.me/Raysynix" target="_blank" rel="noopener">Continue on Telegram ↗</a>
        <button id="closeFaq2" type="button">Close</button>
      </div>
    </div>
  </dialog>

  <script>
    const faqs = [
      ["What exactly do you do?","We study your content and audience to identify problems people repeatedly want solved. We then turn your demonstrated expertise into a creator-native digital product and help take it from product architecture through launch and optimization."],
      ["Do I need an existing digital product?","No. The process is designed to identify a product opportunity from your existing content, audience questions, expertise and frameworks. The product can then be architected around the opportunity we discover."],
      ["How large does my audience need to be?","The intended fit is generally creators with an engaged audience of roughly 10K–100K followers, recurring questions around a specific subject and demonstrated expertise. Audience size alone isn't the only consideration; engagement, expertise and evidence of audience demand matter as well."],
      ["Who owns the product?","The exact ownership structure should be discussed as part of the partnership. The model is designed as a partnership rather than a standard service subscription, with the creator contributing expertise, audience, brand and content while the operator handles the product-development side."],
      ["How does the partnership / revenue model work?","Rather than publishing a fixed revenue-share percentage on the landing page, the partnership structure can be discussed during the application process. The principle is simple: when the product succeeds, both sides benefit."]
    ];
    const dialog=document.getElementById('faqDialog'), title=document.getElementById('faqTitle'), answer=document.getElementById('faqAnswer');
    document.querySelectorAll('[data-faq]').forEach(btn=>btn.addEventListener('click',()=>{const [t,a]=faqs[Number(btn.dataset.faq)]; title.textContent=t; answer.textContent=a; dialog.showModal();}));
    const close=()=>dialog.close(); document.getElementById('closeFaq').onclick=close; document.getElementById('closeFaq2').onclick=close;
    dialog.addEventListener('click',e=>{if(e.target===dialog) close();});
  </script>
</body>
</html>
